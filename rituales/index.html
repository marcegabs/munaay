<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Crea tu Ritual · Whimsy & Rituals · MUNAAY</title>
  <meta name="description" content="Crea tu ritual en cinco partes: intención, acción lunar, color, ingrediente y gesto. Masterclass Whimsy & Rituals de MUNAAY Cósmico.">
  <meta name="theme-color" content="#EEE4D8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Oranienbaum&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #EEE4D8;
      --paper-hi: #F6F0E8;
      --ink: #2A1E19;
      --ink-soft: #6E5A50;
      --choco: #6B3F35;
      --rule: rgba(42,30,25,0.16);
      --rule-strong: rgba(42,30,25,0.42);
      --coral: #E06C55;
      --coral-pale: #F6D3C8;
      --blue: #5D8CB5;
      --blue-pale: #C8D8E6;
      --ochre: #E9B44C;
      --ochre-deep: #B9852B;
      --sage: #8FA77E;
      --rose: #D98C8A;
      --goth: 'Oranienbaum', 'Bodoni 72', 'Didot', serif;
      --serif: 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif;
      --row-h: 74px;
      --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--serif); font-size: 17px; line-height: 1.45; color: var(--ink);
      background: var(--paper);
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh; min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    .rn { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--ink-soft); margin-right: 4px; }
    .goth { font-family: var(--goth); font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.98; color: var(--choco); }
    .goth small { text-transform: none; }
    .caps { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500; }
    em, .it { font-style: italic; }
    .soft { color: var(--ink-soft); }
    :focus-visible { outline: 1.5px solid var(--coral); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- Page frame ---------- */
    .page { background: var(--paper); min-height: 100dvh; }
    .masthead {
      position: sticky; top: 0; z-index: 10;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
      background: rgba(238,228,216,0.94); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--rule);
    }
    .masthead .mid { font-style: italic; font-size: 15px; }
    .captions { display: flex; justify-content: space-between; gap: 10px; font-style: italic; font-size: 14px; color: var(--ink); padding: 14px 0 0; }
    .captions span:nth-child(2) { text-align: center; }
    .captions span:last-child { text-align: right; }

    .screen { display: none; }
    .screen.active { display: block; animation: fade .5s var(--ease) both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .col { padding: 0 18px; }
    .rule-top { border-top: 1px solid var(--rule); }

    /* ---------- Intro ---------- */
    .intro-grid { display: flex; flex-direction: column; }
    .a-hero { order: 1; text-align: center; }
    .a-formula { order: 2; }
    .a-actions { order: 3; }
    .a-catalog { order: 4; }
    .a-saved { order: 5; }

    .title { font-size: 56px; margin: 18px 0 8px; color: var(--choco); }
    .subtitle { font-style: italic; font-size: 16px; line-height: 1.3; }
    .logo { display: block; width: 150px; height: auto; margin: 12px auto 0; opacity: .92; }

    /* ---------- Plate: the day's archangel, annotated like a specimen ---------- */
    .plate-hero { display: grid; grid-template-columns: 1fr 132px 1fr; align-items: center; margin: 28px 0 0; }
    .anno { position: relative; line-height: 1.2; }
    .anno .k { display: block; font-style: italic; font-size: 13px; color: var(--ink-soft); }
    .anno .v { display: block; font-size: 17px; font-weight: 500; }
    .anno .v em { color: var(--coral); font-weight: 400; font-size: 14px; }
    .anno.l { text-align: right; padding-right: 24px; }
    .anno.r { text-align: left; padding-left: 24px; }
    .anno.l::after, .anno.r::before { content: ''; position: absolute; top: 50%; width: 18px; border-top: 1px dotted var(--ink); }
    .anno.l::after { right: 3px; }
    .anno.r::before { left: 3px; }
    .hero-card { position: relative; aspect-ratio: 3 / 4; }
    .hero-card .frame {
      position: absolute; inset: 0; overflow: hidden; background: var(--blue-pale);
      border: 1px solid var(--rule-strong); outline: 5px solid var(--paper-hi); outline-offset: -6px;
      box-shadow: 0 16px 30px -22px rgba(42,30,25,.55);
      animation: appear .5s var(--ease) both;
    }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    .hero-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-card.fan .frame:nth-child(1) { transform: rotate(-6deg) translateX(-8px) scale(.94); }
    .hero-card.fan .frame:nth-child(3) { transform: rotate(6deg) translateX(8px) scale(.94); }
    .plate-cap { font-style: italic; font-size: 20px; line-height: 1.25; margin-top: 18px; }
    .plate-cap small { display: block; font-size: 14px; color: var(--ink-soft); }

    /* ---------- The five parts ---------- */
    .a-formula h2 { font-size: 32px; padding-top: 30px; }
    .a-formula .lede { margin-top: 4px; }
    .parts { list-style: none; border-top: 1px solid var(--rule-strong); margin-top: 14px; }
    .part {
      width: 100%; min-height: 66px; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center;
      text-align: left; padding: 12px 6px 12px 0; border-bottom: 1px solid var(--rule); transition: background .2s;
    }
    .part .num { font-size: 19px; font-style: italic; text-align: center; color: var(--ink-soft); }
    .part .nm { display: block; font-style: italic; font-size: 14px; color: var(--ink-soft); }
    .part .val { display: block; font-size: 18px; font-weight: 500; line-height: 1.2; }
    .part .val.rand { font-weight: 400; font-style: italic; color: var(--ink-soft); }
    .part .vis { display: flex; align-items: center; gap: 8px; }
    .part .vis .thumb { width: 30px; height: 40px; }
    .part .vis .swatch { width: 26px; height: 26px; }
    .part[aria-current="true"] { background: linear-gradient(90deg, var(--paper-hi), transparent 85%); }
    .part[aria-current="true"] .num { color: var(--coral); }

    .a-actions { padding-top: 22px; }
    .status { font-style: italic; font-size: 15px; color: var(--ink-soft); margin-bottom: 12px; text-align: center; }

    /* ---------- Catalog ---------- */
    .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 12px 0 0; margin: 0 -18px; padding-left: 18px; padding-right: 18px; position: sticky; top: 58px; background: var(--paper); z-index: 5; border-bottom: 1px solid var(--rule); }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; min-height: 44px; padding: 0 10px 8px; font-style: italic; font-size: 16px; color: var(--ink-soft); border-bottom: 2px solid transparent; display: inline-flex; align-items: flex-end; gap: 5px; }
    .tab .rn { font-size: 15px; margin-right: 0; }
    .tab[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
    .cat-head { padding: 22px 0 6px; }
    .cat-head h2 { font-size: 36px; }
    .cat-head h2 small { font-family: var(--serif); font-style: italic; font-size: 16px; font-weight: 400; color: var(--ink-soft); margin-left: 6px; letter-spacing: 0; }
    .lede { font-style: italic; font-size: 16px; color: var(--ink); margin-top: 8px; max-width: 46ch; }
    .sub-head { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 8px; }
    .sub-head .caps { color: var(--ink-soft); }

    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--rule); }
    .opt {
      position: relative; text-align: left; padding: 12px 10px 14px; min-height: 64px;
      border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: start;
      transition: background .2s;
    }
    .opt:nth-child(odd) { border-right: 1px solid var(--rule); }
    .opts.single { grid-template-columns: 1fr; }
    .opts.single .opt { border-right: 0; }
    .opt:active { background: var(--paper-hi); }
    .opt[aria-pressed="true"] { background: var(--paper-hi); }
    .opt[aria-pressed="true"]::after {
      content: attr(data-stamp); position: absolute; top: 8px; right: 8px;
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--coral);
      border: 1px solid var(--coral); border-radius: 999px; padding: 1px 7px; transform: rotate(-4deg); background: var(--paper);
    }
    .opt .fig { grid-column: 1 / -1; font-style: italic; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }
    .opt .art { grid-row: span 2; }
    .opt .nm { font-size: 18px; font-weight: 500; line-height: 1.15; padding-right: 54px; }
    .opt .cap { font-style: italic; font-size: 14px; color: var(--ink-soft); line-height: 1.3; margin-top: 3px; }
    .opt .cap.warn { color: #A0442F; }
    .opt.rand .nm { font-family: var(--goth); font-weight: 400; font-size: 21px; text-transform: uppercase; color: var(--choco); }
    .opt.dim { opacity: .5; }
    .opt .today { font-style: italic; color: var(--coral); font-size: 14px; margin-left: 4px; font-weight: 400; }

    .thumb { display: block; width: 40px; height: 54px; overflow: hidden; border: 1px solid var(--rule-strong); outline: 3px solid var(--paper-hi); outline-offset: -4px; background: var(--blue-pale); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.9); }
    .swatch { display: block; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--rule-strong); box-shadow: inset 0 0 0 3px var(--paper-hi); }
    .glyph { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px dashed var(--rule-strong); font-family: var(--goth); font-size: 18px; color: var(--ink-soft); }

    .phases { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
    .phase { text-align: center; padding: 14px 4px 12px; font-size: 14px; }
    .phase + .phase { border-left: 1px solid var(--rule); }
    .phase svg { display: block; margin: 0 auto 6px; }
    .phase .it { display: block; color: var(--ink-soft); font-size: 13px; }
    .phase.now { background: var(--paper-hi); }
    .phase.now .it { color: var(--coral); }
    .phase:not(.now) svg { opacity: .55; }

    /* ---------- Left column ---------- */
    .saved { padding: 26px 0 10px; }
    .saved h2 { font-size: 30px; }
    .saved-list { list-style: none; margin-top: 10px; border-top: 1px solid var(--rule); }
    .saved-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
    .saved-list .info { flex: 1; min-width: 0; }
    .saved-list .info strong { display: block; font-weight: 500; font-size: 17px; line-height: 1.2; }
    .saved-list .info span { font-style: italic; font-size: 14px; color: var(--ink-soft); }
    .saved-list .empty { font-style: italic; color: var(--ink-soft); }
    .mini { min-width: 44px; min-height: 44px; font-style: italic; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

    footer { text-align: center; padding: 28px 18px 34px; }
    footer .caps { color: var(--ochre-deep); text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }

    /* ---------- Buttons ---------- */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; padding: 12px 18px;
      background: var(--ink); color: var(--paper-hi); border-radius: 2px;
      font-size: 13px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500;
      transition: background .2s, transform .1s;
    }
    .btn:active { transform: scale(.985); }
    .btn.line { background: transparent; color: var(--ink); border: 1px solid var(--rule-strong); }
    .btn[disabled] { opacity: .45; pointer-events: none; }
    .link { display: block; margin: 14px auto 0; min-height: 44px; font-style: italic; font-size: 16px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
    .stack > * + * { margin-top: 10px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* ---------- Slot screen ---------- */
    .narrow { max-width: 560px; margin: 0 auto; }
    .slot-head { text-align: center; padding: 6px 0 14px; }
    .slot-head h2 { font-size: 46px; margin: 14px 0 6px; }
    .reels { border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); }
    .row {
      display: grid; grid-template-columns: 40px 1fr 54px; grid-template-rows: auto var(--row-h); column-gap: 8px; align-items: center;
      padding: 10px 0 4px; transition: background .25s;
    }
    .row + .row { border-top: 1px solid var(--rule); }
    .row.locked { background: linear-gradient(90deg, transparent, var(--paper-hi) 20%, var(--paper-hi) 80%, transparent); }
    .row .num { grid-row: 1 / span 2; font-size: 20px; font-style: italic; text-align: center; color: var(--ink-soft); }
    .row-label { grid-column: 2; font-style: italic; font-size: 14px; color: var(--ink-soft); }
    .row.locked .row-label::after { content: attr(data-kept); color: var(--coral); margin-left: 6px; }
    .toggle { grid-column: 3; grid-row: 1 / span 2; justify-self: center; width: 52px; height: 60px; display: grid; place-items: center; }
    .toggle .pill { width: 22px; height: 40px; border-radius: 999px; border: 1px solid var(--ink); position: relative; background: var(--paper-hi); transition: background .25s; }
    .toggle .pill::after { content: ''; position: absolute; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--ink); top: 23px; transition: top .3s var(--ease), background .3s; }
    .toggle[aria-pressed="true"] .pill { background: var(--coral-pale); }
    .toggle[aria-pressed="true"] .pill::after { top: 3px; background: var(--coral); }
    .window {
      grid-column: 2; grid-row: 2; height: var(--row-h); overflow: hidden; position: relative;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
              mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
    }
    .strip { will-change: transform; }
    .item { height: var(--row-h); display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .item .txt { min-width: 0; }
    .item .main { font-size: 20px; font-weight: 500; line-height: 1.12; }
    .item .sub { font-style: italic; font-size: 14px; color: var(--ink-soft); line-height: 1.25; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item .sub.warn { color: #A0442F; }
    .item .today { font-style: italic; color: var(--coral); font-size: 15px; font-weight: 400; margin-left: 4px; }
    .item .thumb { width: 36px; height: 48px; }
    .slot-hint { text-align: center; font-style: italic; font-size: 15px; color: var(--ink-soft); margin: 14px 0 6px; }
    .slot-actions { margin: 20px 0 10px; }

    /* ---------- Ritual plate ---------- */
    .plate { padding: 0 0 8px; }
    .plate .captions { padding-top: 14px; }
    .plate-art { width: 150px; margin: 22px auto 6px; text-align: center; }
    .plate-art .frame { display: block; aspect-ratio: 3 / 4; overflow: hidden; border: 1px solid var(--rule-strong); outline: 5px solid var(--paper-hi); outline-offset: -6px; background: var(--blue-pale); }
    .plate-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .plate-art figcaption { font-style: italic; font-size: 14px; color: var(--ink-soft); margin-top: 8px; }
    .plate h2 { text-align: center; font-size: 44px; margin: 14px 0 8px; }
    .plate .meta { text-align: center; font-style: italic; font-size: 16px; color: var(--ink-soft); }
    .legend { display: grid; grid-template-columns: 1fr 1fr; margin: 22px 0 6px; border-top: 1px solid var(--rule-strong); }
    .legend div { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--rule); }
    .legend div:nth-child(odd) { border-right: 1px solid var(--rule); }
    .legend div:nth-child(even) { padding-left: 12px; }
    .legend div:last-child { grid-column: 1 / -1; border-right: 0; }
    .legend dt { font-style: italic; font-size: 13px; color: var(--ink-soft); }

    .legend dd { font-size: 17px; font-weight: 500; line-height: 1.2; }
    .plate h3 { font-family: var(--goth); font-weight: 400; text-transform: uppercase; color: var(--choco); font-size: 28px; margin: 24px 0 10px; }
    .steps { list-style: none; counter-reset: s; }
    .steps li { counter-increment: s; position: relative; padding: 0 0 12px 40px; font-size: 17px; }
    .steps li::before { content: counter(s, lower-roman) "."; position: absolute; left: 0; top: 0; font-style: italic; color: var(--coral); font-size: 17px; }
    .prompt { font-style: italic; font-size: 21px; line-height: 1.3; border-left: 2px solid var(--ochre); padding: 4px 0 4px 16px; }
    .gratitude { text-align: center; font-style: italic; font-size: 19px; margin: 26px 0 0; }
    .footnotes { margin-top: 26px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--ink-soft); }
    .footnotes li { list-style: none; padding-left: 14px; position: relative; }
    .footnotes li::before { content: '†'; position: absolute; left: 0; color: var(--coral); }
    .plate .sign { text-align: center; margin-top: 22px; }
    .plate .sign .caps { color: var(--ochre-deep); }
    .card-actions { padding: 18px 0 8px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px);
      background: var(--ink); color: var(--paper-hi); padding: 11px 18px; font-style: italic; font-size: 15px;
      max-width: calc(100% - 32px); width: max-content; opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s var(--ease); z-index: 30;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- Desktop: framed monograph with three columns ---------- */
    @media (min-width: 980px) {
      body { background: linear-gradient(165deg, #F8CACC 0%, #F5C4C8 52%, #C9B5C4 78%, #6FA3B0 100%) fixed; padding: 48px 32px; }
      .page { max-width: 1240px; margin: 0 auto; border: 7px solid #fff; border-radius: 12px; min-height: auto; box-shadow: 0 30px 60px -30px rgba(42,30,25,.45); overflow: clip; }
      .masthead { position: static; background: transparent; }
      .intro-grid {
        display: grid; grid-template-columns: 1fr 1.1fr 1.1fr; align-items: start;
        grid-template-areas: "formula hero catalog" "saved actions catalog";
      }
      .intro-grid > .col { padding: 0 26px 30px; }
      .a-formula { grid-area: formula; } .a-hero { grid-area: hero; } .a-catalog { grid-area: catalog; border-left: 1px solid var(--rule); align-self: stretch; }
      .a-saved { grid-area: saved; } .a-actions { grid-area: actions; }
      .a-formula, .a-saved { border-right: 1px solid var(--rule); align-self: stretch; }
      .a-formula h2 { padding-top: 26px; }
      .tabs { position: static; margin: 0; padding: 14px 0 0; }
      .opts { max-height: 640px; overflow-y: auto; }
      .title { font-size: 60px; }
      .narrow { padding-bottom: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <span></span>
    <span class="mid">Whimsy &amp; Rituals</span>
    <span></span>
  </header>

  <main>
    <!-- ============ Screen 1: plate, parts and catalog ============ -->
    <section id="screen-intro" class="screen active" aria-labelledby="intro-title">
      <div class="intro-grid">
        <div class="col a-hero">
          <div class="captions"><span>Masterclass</span><span id="cap-date"></span><span id="cap-moon"></span></div>
          <h1 class="title goth" id="intro-title">Crea tu Ritual</h1>
          <p class="subtitle">Un ritual en cinco partes.<br>Elige las que quieras y deja el resto al azar.</p>
          <img class="logo" src="munaay.svg" alt="MUNAAY Cósmico" width="150" height="49">
          <div class="plate-hero" id="plate-hero"></div>
          <p class="plate-cap" id="plate-cap"></p>
        </div>

        <div class="col a-formula">
          <h2 class="goth">Las cinco partes</h2>
          <p class="lede">Toca una parte para ver sus opciones.</p>
          <ol class="parts" id="parts"></ol>
        </div>

        <div class="col a-actions">
          <p class="status" id="status"></p>
          <div class="stack">
            <button type="button" class="btn" id="btn-go">Girar con mis elecciones</button>
            <button type="button" class="btn line" id="btn-random">Todo al azar</button>
            <button type="button" class="link" id="btn-reset">Reiniciar elecciones</button>
          </div>
        </div>

        <div class="col a-catalog">
          <nav class="tabs" id="tabs" role="tablist"></nav>
          <div id="catalog" role="tabpanel"></div>
        </div>

        <div class="col a-saved">
          <div class="saved">
            <h2 class="goth">Mis rituales</h2>

    const NONE_INGREDIENT = { id: 'ninguno', name: { es: 'Ninguno a la mano', en: 'Nothing at hand' }, safety: [], use: null };
    const ING_BY_ID = Object.fromEntries([...INGREDIENTS, NONE_INGREDIENT].map(i => [i.id, i]));

    const GESTURES = [
      { id: 'escribir', min: 6, name: { es: 'Escribir una intención en papel', en: 'Write an intention on paper' },
        step: { es: 'Escribe tu intención en un papel, en tiempo presente, y guárdalo donde puedas verlo.', en: 'Write your intention on a piece of paper, in the present tense, and keep it somewhere you can see it.' } },
      { id: 'respirar', min: 2, name: { es: 'Tres respiraciones lentas', en: 'Three slow breaths' },
        step: { es: 'Haz tres respiraciones lentas. En cada exhalación, repite por dentro: «{p}»', en: 'Take three slow breaths. With each exhale, repeat silently: “{p}”' } },
      { id: 'caminar', min: 3, name: { es: 'Caminar hasta una ventana', en: 'Walk to a window' },
        step: { es: 'Camina despacio hasta una ventana y mira hacia afuera durante un minuto, pensando en {f}.', en: 'Walk slowly to a window and look outside for a minute, thinking about {f}.' } },
      { id: 'abrir', min: 3, name: { es: 'Abrir una ventana', en: 'Open a window' },
        step: { es: 'Abre una ventana y deja entrar el aire nuevo, como símbolo de lo que deseas invitar.', en: 'Open a window and let fresh air in, as a symbol of what you wish to invite.' } },
      { id: 'manos', min: 4, name: { es: 'Lavarse las manos con agua y decir una frase', en: 'Wash your hands with water and say a phrase' },
        step: { es: 'Lávate las manos con agua fresca y, mientras lo haces, di: «{p}»', en: 'Wash your hands with cool water and, as you do, say: “{p}”' } },
      { id: 'hilo', min: 5, name: { es: 'Atar un hilo', en: 'Tie a thread' },
        step: { es: 'Ata un hilo suave alrededor de tu muñeca o de un objeto querido mientras dices: «{p}»', en: 'Tie a soft thread around your wrist or a cherished object while you say: “{p}”' } },
      { id: 'voz', min: 2, name: { es: 'Decir una frase en voz alta', en: 'Say a phrase out loud' },
        step: { es: 'Di en voz alta, con calma: «{p}»', en: 'Say out loud, calmly: “{p}”' } },
      { id: 'vela', min: 10, flame: true, name: { es: 'Encender una vela', en: 'Light a candle' },
        step: { es: 'Enciende una vela, si puede ser de color {c}, y obsérvala unos minutos. Apágala al terminar.', en: 'Light a candle, {c} if you have one, and watch it for a few minutes. Put it out when you finish.' } }
    ];
    const GEST_BY_ID = Object.fromEntries(GESTURES.map(g => [g.id, g]));

    /* ---------------- Moon (live) ---------------- */
    const SYNODIC = 29.530588853;
    const REF_NEW_MOON = Date.UTC(2000, 0, 6, 18, 14);
    function lunarAge(d = new Date()) { const days = (d - REF_NEW_MOON) / 86400000; return ((days % SYNODIC) + SYNODIC) % SYNODIC; }
    const PHASES = ['nueva', 'creciente', 'llena', 'menguante'];
    function phaseFromAge(age) { const s = (age + 3.69) % SYNODIC; return PHASES[Math.min(3, Math.floor(s / 7.38))]; }


    /* ---------------- State ---------------- */
    const ROWS = ['intention', 'moon', 'color', 'ingredient', 'gesture'];
    const NUM = { intention: 'I', moon: 'II', color: 'III', ingredient: 'IV', gesture: 'V' };
    const CAT_COLOR = { intention: '#E06C55', moon: '#5D8CB5', color: '#E9B44C', ingredient: '#8FA77E', gesture: '#D98C8A' };
    const now = new Date();
    const TODAY = now.getDay();
    const AGE = lunarAge(now);
    const PHASE = phaseFromAge(AGE);
    const LUNAR_DAY = Math.floor(AGE) + 1;

    const store = {
      get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
      set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } }
    };

    const prefs = store.get('rsm.prefs', { table: [] });
    const defaultPins = () => ({ intention: TODAY, moon: null, color: null, gesture: null });
    const state = {
      lang: 'es',
      table: Array.isArray(prefs.table) ? prefs.table : [],
      pins: defaultPins(),      // null = left to chance
      tab: 'intention',
      values: { intention: null, moon: null, color: null, ingredient: null, gesture: null },
      locks: { intention: false, moon: false, color: false, ingredient: false, gesture: false },
      spinning: false,
      current: null
    };
    const hasCandle = () => state.table.includes('vela');
    const tableIngredients = () => state.table.filter(id => ING_BY_ID[id] && id !== 'ninguno');

    function savePrefs() { store.set('rsm.prefs', { table: state.table }); }

    /* ---------------- Helpers ---------------- */
    const $ = sel => document.querySelector(sel);
    const L = obj => obj[state.lang];
    function fill(s, vars) { for (const k in vars) s = s.split('{' + k + '}').join(vars[k]); return s; }
    function t(key, vars) { const s = UI[state.lang][key]; return vars ? fill(s, vars) : s; }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    function pickDifferent(pool, current) { return pool.length > 1 ? pick(pool.filter(v => v !== current)) : pool[0]; }
    function archLabel(a) { return a ? t('archangel', { a: L(ARCH[a]) }) : t('noArch'); }
    const clip = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let toastTimer;
    function toast(msg) {
      const el = $('#toast');
      el.textContent = msg; el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }

    /* ---------------- Pools & constraints ---------------- */
    function intentionById(day) { return INTENTIONS.find(i => i.day === day); }

    function pools(intentionDay) {
      const intention = intentionById(intentionDay ?? TODAY);
      let ing;
      if (state.table.includes('ninguno')) ing = ['ninguno'];
      else { const chosen = tableIngredients(); ing = chosen.length ? chosen : INGREDIENTS.map(i => i.id); }
      let gest = GESTURES.map(g => g.id);
      if (!hasCandle()) gest = gest.filter(id => id !== 'vela');
      return { intention: INTENTIONS.map(i => i.day), moon: MOON_ACTIONS[PHASE].map(a => a.id), color: intention.colors, ingredient: ing, gesture: gest };
    }

    // Enforce safety rules on current values, overriding locks when needed. Returns notice keys.
    function applyConstraints() {
      const v = state.values, p = pools(v.intention), notes = [];
      if (v.ingredient && !p.ingredient.includes(v.ingredient)) { v.ingredient = pick(p.ingredient); state.locks.ingredient = false; notes.push('swapIngredient'); }
      if (v.gesture === 'vela' && !hasCandle()) { v.gesture = pick(p.gesture); state.locks.gesture = false; notes.push('swapCandle'); }
      if (v.moon && !p.moon.includes(v.moon)) v.moon = pick(p.moon);
      return notes;
    }

    /* ---------------- Pins (first screen) ---------------- */
    function isPinned(cat) {
      if (cat === 'ingredient') return state.table.includes('ninguno') || tableIngredients().length > 0;
      return state.pins[cat] != null;
    }
    const pinnedCount = () => ROWS.filter(isPinned).length;

    function pinLabel(cat) {
      if (!isPinned(cat)) return t('rand');
      const p = state.pins[cat];
      if (cat === 'intention') return UI[state.lang].dayShort[p] + (p === TODAY ? ' · ' + t('today') : '');
      if (cat === 'moon') return L(MOON_ACTIONS[PHASE].find(a => a.id === p).name);
      if (cat === 'color') return L(COLORS[p].name);
      if (cat === 'gesture') return L(GEST_BY_ID[p].name);
      if (state.table.includes('ninguno')) return L(NONE_INGREDIENT.name);
      const n = tableIngredients().length;
      return n === 1 ? L(ING_BY_ID[tableIngredients()[0]].name) : t('ingCount', { n });
    }

    function choose(cat, val) {
      if (cat === 'ingredient') {
        if (val === 'ninguno') {
          const candle = state.table.filter(x => x === 'vela');
          state.table = state.table.includes('ninguno') ? candle : ['ninguno', ...candle];
        } else {
          state.table = state.table.filter(x => x !== 'ninguno' || val === 'vela');
          state.table = state.table.includes(val) ? state.table.filter(x => x !== val) : [...state.table, val];
          if (val === 'vela' && !hasCandle() && state.pins.gesture === 'vela') state.pins.gesture = null;
        }
        savePrefs();
      } else {
        const next = val === '__rand' ? null : (cat === 'intention' ? Number(val) : val);
        state.pins[cat] = state.pins[cat] === next && cat !== 'intention' ? null : next;
        if (cat === 'intention' && state.pins.color && state.pins.intention != null && !intentionById(state.pins.intention).colors.includes(state.pins.color)) state.pins.color = null;
        if (cat === 'gesture' && state.pins.gesture === 'vela' && !hasCandle()) { state.table = [...state.table, 'vela']; savePrefs(); }
      }
      renderIntro();
    }

    /* ---------------- Moon drawing ---------------- */
    function moonLitPath(age, cx, cy, r) {
      const k = Math.cos(2 * Math.PI * age / SYNODIC);
      const waxing = age < SYNODIC / 2;
      const outer = waxing ? 1 : 0, inner = waxing ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
      return `M ${cx} ${cy - r} A ${r} ${r} 0 0 ${outer} ${cx} ${cy + r} A ${Math.abs(k) * r} ${r} 0 0 ${inner} ${cx} ${cy - r} Z`;
    }

    /* ---------------- Catalog ---------------- */
    function renderTabs() {
      $('#tabs').innerHTML = ROWS.map(c => `<button type="button" class="tab" role="tab" data-tab="${c}" aria-selected="${state.tab === c}"><span class="rn">${NUM[c]}.</span>${esc(UI[state.lang].cats[c].name)}</button>`).join('');
    }

    const moonMini = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#DCE5EE"/><path d="${moonLitPath(AGE, 20, 20, 17)}" fill="#E9B44C"/><circle cx="20" cy="20" r="17" fill="none" stroke="#2A1E19" stroke-width=".8"/></svg>`;

    function renderPlate() {
      const d = state.pins.intention;
      if (d == null) {
        $('#plate-hero').innerHTML = `
          <div class="anno l"><span class="k">${esc(t('annoDay'))}</span><span class="v">${esc(t('fanDay'))}</span></div>
          <div class="hero-card fan">${['miguel', 'gabriel', 'rafael'].map(n => `<span class="frame"><img src="arcangeles/${n}.jpg" alt=""></span>`).join('')}</div>
          <div class="anno r"><span class="k">${esc(t('annoArch'))}</span><span class="v">${esc(t('fanArch'))}</span></div>`;
        $('#plate-cap').textContent = t('fanCap');
        return;
      }
      const i = intentionById(d);
      $('#plate-hero').innerHTML = `
        <div class="anno l"><span class="k">${esc(t('annoDay'))}</span><span class="v">${esc(DAYS[state.lang][d])}${d === TODAY ? `<br><em>${esc(t('today'))}</em>` : ''}</span></div>
        <div class="hero-card"><span class="frame"><img src="${archImg(i.arch)}" alt="${esc(t('archangel', { a: L(ARCH[i.arch]) }))}"></span></div>
        <div class="anno r"><span class="k">${esc(t('annoArch'))}</span><span class="v">${esc(L(ARCH[i.arch]))}</span></div>`;
      $('#plate-cap').innerHTML = `<small>${esc(t('dayIntention'))}</small>${esc(L(i.name))}`;
    }

    function renderParts() {
      $('#parts').innerHTML = ROWS.map(c => {
        const pinned = isPinned(c);
        let val = pinned ? pinLabel(c) : t('random'), vis = '';
        if (c === 'intention' && pinned) { const i = intentionById(state.pins.intention); val = `${DAYS[state.lang][state.pins.intention]}: ${L(i.name)}`; vis = thumbHTML(i.arch); }
        if (c === 'moon') vis = moonMini(28);
        if (c === 'color' && pinned) vis = `<span class="swatch" style="background:${COLORS[state.pins.color].hex}"></span>`;
        return `<li><button type="button" class="part" data-tab="${c}" aria-current="${state.tab === c}">
          <span class="num" aria-hidden="true">${NUM[c]}</span>
          <span><span class="nm">${esc(UI[state.lang].cats[c].name)}</span><span class="val${pinned ? '' : ' rand'}">${esc(val)}</span></span>
          <span class="vis" aria-hidden="true">${vis}</span>
        </button></li>`;
      }).join('');
    }

    function opt({ cat, val, pressed, fig, art = '', name, cap = '', capWarn = false, cls = '', stamp }) {
      return `<button type="button" class="opt ${cls}" data-cat="${cat}" data-val="${esc(val)}" aria-pressed="${pressed}" data-stamp="${esc(stamp || t('pinnedStamp'))}">
        ${art ? `<span class="art" aria-hidden="true">${art}</span>` : ''}
        <span><span class="nm">${name}</span>${cap ? `<span class="cap${capWarn ? ' warn' : ''}" style="display:block">${esc(cap)}</span>` : ''}</span>
      </button>`;
    }

    function randOpt(cat) {
      return opt({ cat, val: '__rand', pressed: state.pins[cat] == null, name: esc(t('random')), cap: t('randomCap'), cls: 'rand', stamp: t('rand') });
    }

    function renderCatalog() {
      const c = state.tab, T = UI[state.lang];
      let html = `<div class="cat-head"><h2 class="goth">${esc(T.cats[c].name)}<small>${esc(pinLabel(c))}</small></h2><p class="lede">${esc(T.cats[c].desc)}</p></div>`;

      if (c === 'intention') {
        html += `<div class="sub-head"><span class="caps">${esc(t('choose'))}</span></div><div class="opts">`;
        html += randOpt('intention');
        WEEK.forEach((d, n) => {
          const i = intentionById(d);
          html += opt({ cat: c, val: d, pressed: state.pins.intention === d, fig: `fig. ${n + 1}`, art: thumbHTML(i.arch),
            name: esc(DAYS[state.lang][d]) + (d === TODAY ? `<span class="today">${esc(t('today'))}</span>` : ''),
            cap: `${L(i.name)} · ${L(ARCH[i.arch])}` });
        });
        html += '</div>';
      } else if (c === 'moon') {
        const ages = { nueva: 0.5, creciente: 5.5, llena: 14.8, menguante: 22.5 };
        html += `<div class="sub-head"><span class="caps">${esc(t('phasesTitle'))}</span><span class="it soft">${esc(t('lunarDay', { n: LUNAR_DAY }))}</span></div><div class="phases">`;
        PHASES.forEach(ph => {
          const age = ph === PHASE ? AGE : ages[ph];
          html += `<div class="phase${ph === PHASE ? ' now' : ''}"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#DCE5EE"/><path d="${moonLitPath(age, 20, 20, 17)}" fill="#E9B44C"/><circle cx="20" cy="20" r="17" fill="none" stroke="#2A1E19" stroke-width=".7"/></svg>${esc(L(PHASE_NAMES[ph]).replace(/^Luna |moon$/gi, '').trim())}<span class="it">${ph === PHASE ? esc(t('today')) : MOON_ACTIONS[ph].map(a => esc(L(a.name).toLowerCase())).join(', ')}</span></div>`;
        });
        html += `</div><div class="sub-head"><span class="caps">${esc(t('actionsTitle'))}</span></div><div class="opts single">`;
        html += randOpt('moon');
        MOON_ACTIONS[PHASE].forEach((a, n) => {
          html += opt({ cat: c, val: a.id, pressed: state.pins.moon === a.id, fig: `fig. ${n + 1}`, name: esc(L(a.name)), cap: L(a.step) });
        });
        html += '</div>';
      } else if (c === 'color') {
        const intent = state.pins.intention != null ? intentionById(state.pins.intention) : null;
        const keys = intent ? intent.colors : Object.keys(COLORS);
        html += `<div class="sub-head"><span class="caps">${esc(intent ? t('colorsFor', { i: L(intent.name) }) : t('colorsAll'))}</span></div><div class="opts">`;
        html += randOpt('color');
        keys.forEach((k, n) => {
          const col = COLORS[k];
          html += opt({ cat: c, val: k, pressed: state.pins.color === k, fig: `fig. ${n + 1}`, art: `<span class="swatch" style="background:${col.hex}"></span>`,
            name: esc(L(col.name)), cap: `${L(col.m)} · ${archLabel(col.arch)}` });
        });
        html += '</div>';
      } else if (c === 'ingredient') {
        const n = tableIngredients().length;
        html += `<div class="sub-head"><span class="caps">${esc(t('tableTitle'))}</span><span class="it soft">${esc(state.table.includes('ninguno') ? L(NONE_INGREDIENT.name) : n ? t('ingCount', { n }) : t('ingAll'))}</span></div><div class="opts">`;
        [...INGREDIENTS, CANDLE_CHIP, NONE_INGREDIENT].forEach((ing, k) => {
          const cap = ing.id === 'vela' ? L(SAFETY.llama) : ing.safety.map(s => L(SAFETY[s])).join(' ');
          const warn = ing.id === 'ruda' || ing.id === 'vela' || ing.safety.includes('aroma') || ing.flame;
          html += opt({ cat: c, val: ing.id, pressed: state.table.includes(ing.id), fig: `fig. ${k + 1}`, name: esc(L(ing.name)), cap, capWarn: warn, stamp: t('onTable') });
        });
        html += '</div>';
      } else if (c === 'gesture') {
        html += `<div class="sub-head"><span class="caps">${esc(t('choose'))}</span></div><div class="opts single">`;
        html += randOpt('gesture');
        GESTURES.forEach((g, n) => {
          const cap = t('minutes', { n: g.min }) + (g.flame ? ` · ${hasCandle() ? L(SAFETY.llama) : t('needsCandle')}` : '');
          html += opt({ cat: c, val: g.id, pressed: state.pins.gesture === g.id, fig: `fig. ${n + 1}`, name: esc(L(g.name)), cap, capWarn: !!g.flame });
        });
        html += '</div>';
      }
      $('#catalog').innerHTML = html;
    }

    function renderStatus() {
      const n = pinnedCount();
      $('#status').textContent = n === 0 ? t('statusNone') : n === 5 ? t('statusAll') : t('status', { n });
    }

    function renderIntro() {
      renderPlate(); renderParts(); renderTabs(); renderCatalog(); renderStatus();
    }

    /* ---------------- Static text ---------------- */
    function renderStatic() {
      document.documentElement.lang = state.lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      const date = new Intl.DateTimeFormat(state.lang, { weekday: 'long', day: 'numeric', month: 'short' }).format(now);
      const moonCap = `${L(PHASE_NAMES[PHASE])} · ${LUNAR_DAY}`;
      $('#cap-date').textContent = date; $('#cap-moon').textContent = moonCap;
      document.querySelectorAll('.cap-date').forEach(e => { e.textContent = date; });
      document.querySelectorAll('.cap-moon').forEach(e => { e.textContent = moonCap; });
      renderIntro();
      renderSaved();
      if (document.querySelector('#screen-slots.active')) renderRows();
      if (state.current) renderCard(state.current);
    }

    /* ---------------- Slot rows ---------------- */
    function itemHTML(row, value) {
      if (value == null) return '<div class="item"></div>';
      let main = '', sub = '', pre = '', subClass = 'sub';
      if (row === 'intention') {
        const i = intentionById(value);
        pre = thumbHTML(i.arch);
        main = esc(L(i.name)) + (value === TODAY ? `<span class="today">${esc(t('today'))}</span>` : '');
        sub = `${DAYS[state.lang][value]} · ${L(ARCH[i.arch])}`;
      } else if (row === 'moon') {
        const a = MOON_ACTIONS[PHASE].find(x => x.id === value);
        pre = `<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#DCE5EE"/><path d="${moonLitPath(AGE, 20, 20, 17)}" fill="#E9B44C"/><circle cx="20" cy="20" r="17" fill="none" stroke="#2A1E19" stroke-width=".8"/></svg>`;
        main = esc(L(a.name));
        sub = `${L(PHASE_NAMES[PHASE])} · ${t('lunarDay', { n: LUNAR_DAY })}`;
      } else if (row === 'color') {
        const c = COLORS[value];
        pre = `<span class="swatch" style="background:${c.hex}" aria-hidden="true"></span>` + thumbHTML(c.arch);
        main = esc(L(c.name));
        sub = `${archLabel(c.arch)} · ${L(c.m)}`;
      } else if (row === 'ingredient') {
        const ing = ING_BY_ID[value];
        main = esc(L(ing.name));
        sub = ing.safety.map(s => L(SAFETY[s])).join(' ');
        if (value === 'ruda' || ing.safety.includes('aroma') || ing.flame) subClass += ' warn';
      } else if (row === 'gesture') {
        const g = GEST_BY_ID[value];
        main = esc(L(g.name));
        sub = g.flame ? L(SAFETY.llama) : t('minutes', { n: g.min });
        if (g.flame) subClass += ' warn';
      }
      return `<div class="item">${pre}<div class="txt"><div class="main">${main}</div>${sub ? `<div class="${subClass}">${esc(sub)}</div>` : ''}</div></div>`;
    }

    function renderRows() {
      $('#rows').innerHTML = ROWS.map(r => {
        const locked = state.locks[r], label = UI[state.lang].rows[r];
        return `<div class="row${locked ? ' locked' : ''}" data-row="${r}">
          <div class="num" aria-hidden="true">${NUM[r]}</div>
          <div class="row-label" data-kept="${esc(t('kept'))}">${esc(label)}</div>
          <button type="button" class="toggle" data-lock="${r}" aria-pressed="${locked}" aria-label="${esc(t(locked ? 'unlock' : 'lock', { r: label }))}"><span class="pill"></span></button>
          <div class="window"><div class="strip">${itemHTML(r, state.values[r])}</div></div>
        </div>`;
      }).join('');
    }

    function updateLock(r) {
      const row = document.querySelector(`.row[data-row="${r}"]`);
      if (!row) return;
      const locked = state.locks[r], label = UI[state.lang].rows[r];
      row.classList.toggle('locked', locked);
      const b = row.querySelector('.toggle');
      b.setAttribute('aria-pressed', String(locked));
      b.setAttribute('aria-label', t(locked ? 'unlock' : 'lock', { r: label }));
    }

    /* ---------------- Spin ---------------- */
    const SPIN_MS = 800, STAGGER_MS = 120;

    function spin(all) {
      if (state.spinning) return;
      if (all) ROWS.forEach(r => { state.locks[r] = false; });
      const targets = ROWS.filter(r => !state.locks[r]);
      if (!targets.length) { toast(t('allLocked')); return; }

      const prev = { ...state.values }, v = state.values;
      if (targets.includes('intention')) v.intention = pickDifferent(pools().intention, prev.intention);
      const p = pools(v.intention);
      targets.forEach(r => { if (r !== 'intention') v[r] = pickDifferent(p[r], prev[r]); });
      const notes = applyConstraints();
      const animate = ROWS.filter(r => targets.includes(r) || v[r] !== prev[r]);

      renderRows();
      if (reduceMotion) { if (notes.length) toast(t(notes[0])); return; }

      state.spinning = true;
      setButtonsDisabled(true);
      const H = document.querySelector('.window').clientHeight;
      animate.forEach((r, idx) => {
        const strip = document.querySelector(`.row[data-row="${r}"] .strip`);
        const fillers = [];
        for (let i = 0; i < 9; i++) fillers.push(pick(p[r]));
        const seq = [prev[r], ...fillers, v[r]];
        strip.innerHTML = seq.map(val => itemHTML(r, val)).join('');
        strip.style.transition = 'none';
        strip.style.transform = 'translateY(0)';
        void strip.offsetHeight;
        strip.style.transition = `transform ${SPIN_MS}ms cubic-bezier(.15,.75,.25,1) ${idx * STAGGER_MS}ms`;
        strip.style.transform = `translateY(-${(seq.length - 1) * H}px)`;
      });
      setTimeout(() => {
        renderRows();
        state.spinning = false;
        setButtonsDisabled(false);
        if (notes.length) toast(t(notes[0]));
      }, SPIN_MS + STAGGER_MS * (animate.length - 1) + 60);
    }

    function setButtonsDisabled(d) { ['#btn-spin', '#btn-spin-all', '#btn-create'].forEach(s => { $(s).disabled = d; }); }

    // Start the machine from the first screen: pinned parts arrive kept, the rest spin.
    function startMachine(useRandom) {
      const v = state.values;
      ROWS.forEach(r => { v[r] = null; state.locks[r] = false; });
      if (!useRandom) {
        v.intention = state.pins.intention; v.moon = state.pins.moon; v.color = state.pins.color; v.gesture = state.pins.gesture;
        if (state.table.includes('ninguno')) v.ingredient = 'ninguno';
        else if (tableIngredients().length === 1) v.ingredient = tableIngredients()[0];
        ROWS.forEach(r => { state.locks[r] = v[r] != null; });
      }
      state.current = null;
      show('screen-slots');
      renderRows();
      if (ROWS.every(r => state.locks[r])) { const notes = applyConstraints(); renderRows(); if (notes.length) toast(t(notes[0])); return; }
      requestAnimationFrame(() => spin(useRandom));
    }

    /* ---------------- Ritual composition ---------------- */
    function buildRitual(sel, lang) {
      const T = UI[lang], tr = o => o[lang];
      const intention = intentionById(sel.intention);
      const moon = MOON_ACTIONS[sel.phase].find(a => a.id === sel.moon) || MOON_ACTIONS[sel.phase][0];
      const color = COLORS[sel.color];
      const ing = ING_BY_ID[sel.ingredient] || NONE_INGREDIENT;
      const gest = GEST_BY_ID[sel.gesture];
      const f = tr(intention.focus), p = tr(intention.phrase);

      const steps = [fill(T.stepColor, { c: tr(color.lower), m: tr(color.m) })];
      if (ing.use) steps.push(fill(T.stepIngredient, { u: tr(ing.use), f }));
      steps.push(tr(moon.step));
      steps.push(fill(tr(gest.step), { p, f, c: tr(color.lower) }));
      steps.push(T.stepClose);

      const safety = [];
      ing.safety.forEach(s => safety.push(tr(SAFETY[s])));
      if (gest.flame) safety.push(tr(SAFETY.llama));

      const minutes = Math.max(2, Math.min(10, gest.min));
      return {
        title: tr(intention.title),
        meta: `${tr(PHASE_NAMES[sel.phase])} · ${fill(T.lunarDay, { n: sel.lunarDay })} · ${fill(T.minutes, { n: minutes })}`,
        items: [
          ['intention', T.rows.intention, tr(intention.name)],
          ['moon', T.rows.moon, tr(moon.name)],
          ['color', T.rows.color, `${tr(color.name)} · ${color.arch ? fill(T.archangel, { a: tr(ARCH[color.arch]) }) : T.noArch}`],
          ['ingredient', T.rows.ingredient, ing.id === 'ninguno' ? T.withNoIngredient : tr(ing.name)],
          ['gesture', T.rows.gesture, tr(gest.name)]
        ],
        steps, prompt: tr(intention.prompt), gratitude: tr(intention.gratitude), safety,
        colorHex: color.hex, arch: intention.arch, archName: tr(ARCH[intention.arch]),
        dayName: DAYS[lang][sel.intention]
      };
    }

    function currentSelection() {
      return {
        id: Date.now().toString(36), created: new Date().toISOString(),
        intention: state.values.intention, moon: state.values.moon, phase: PHASE, lunarDay: LUNAR_DAY,
        color: state.values.color, ingredient: state.values.ingredient, gesture: state.values.gesture
      };
    }

    function renderCard(sel) {
      const r = buildRitual(sel, state.lang), T = UI[state.lang];
      const date = new Intl.DateTimeFormat(state.lang, { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(sel.created));
      $('#ritual').innerHTML = `
        <div class="captions"><span>${esc(T.plateNo)} I</span><span>${esc(date)}</span><span>${esc(r.dayName)}</span></div>
        <figure class="plate-art"><span class="frame"><img src="${archImg(r.arch)}" alt="" width="360" height="480"></span><figcaption>${esc(fill(T.archangel, { a: r.archName }))}</figcaption></figure>
        <h2 class="goth">${esc(r.title)}</h2>
        <p class="meta">${esc(r.meta)}</p>
        <dl class="legend">${r.items.map(([k, label, v]) => `<div><dt><span class="rn">${NUM[k]}.</span>${esc(label)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
        <h3>${esc(T.stepsTitle)}</h3>
        <ol class="steps">${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
        <h3>${esc(T.promptTitle)}</h3>
        <p class="prompt">${esc(r.prompt)}</p>
        <p class="gratitude">${esc(r.gratitude)}</p>
        ${r.safety.length ? `<ul class="footnotes" aria-label="${esc(T.safetyTitle)}">${r.safety.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
        <p class="sign"><span class="caps">Whimsy &amp; Rituals · MUNAAY Cósmico</span></p>`;
    }

    /* ---------------- Saved list ---------------- */
    const SAVED_KEY = 'rsm.saved';
    function getSaved() { const s = store.get(SAVED_KEY, []); return Array.isArray(s) ? s : []; }
    function sameRitual(a, b) { return ['intention', 'moon', 'phase', 'color', 'ingredient', 'gesture'].every(k => a[k] === b[k]); }

    function renderSaved() {
      const list = getSaved(), el = $('#saved-list');
      if (!list.length) { el.innerHTML = `<li class="empty">${esc(t('savedEmpty'))}</li>`; return; }
      const fmt = new Intl.DateTimeFormat(state.lang, { day: 'numeric', month: 'short', year: 'numeric' });
      el.innerHTML = list.slice().reverse().map(s => {
        let b;
        try { b = buildRitual(s, state.lang); } catch (e) { return ''; }
        return `<li>${thumbHTML(b.arch)}
          <div class="info"><strong>${esc(b.title)}</strong><span>${esc(fmt.format(new Date(s.created)))} · ${esc(L(PHASE_NAMES[s.phase] || PHASE_NAMES.nueva))}</span></div>
          <button type="button" class="mini" data-view="${esc(s.id)}">${esc(t('view'))}</button>
          <button type="button" class="mini" data-del="${esc(s.id)}" aria-label="${esc(t('del') + ': ' + b.title)}">${esc(t('del'))}</button>
        </li>`;
      }).join('');
    }

    function saveCurrent() {
      if (!state.current) return;
      const list = getSaved();
      if (list.some(s => sameRitual(s, state.current))) { toast(t('alreadySaved')); return; }
      list.push(state.current);
      if (store.set(SAVED_KEY, list)) { toast(t('saved')); renderSaved(); }
      else toast(t('saveError'));
    }

    /* ---------------- PNG download (canvas) ---------------- */
    function wrapLines(ctx, text, maxW) {
      const words = text.split(/\s+/), lines = [];
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
      }
      if (line) lines.push(line);
      return lines;
    }

    function loadImage(src) {
      return new Promise(res => { const img = new Image(); img.onload = () => res(img); img.onerror = () => res(null); img.src = src; });
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    const ROMAN = ['i', 'ii', 'iii', 'iv', 'v', 'vi'];

    // Lays out and paints the ritual plate; img (archangel art) is optional.
    function paintCard(r, T, img, dateStr) {
      const W = 1080, PAD = 100, IW = W - PAD * 2;
      const GOTH = "'Oranienbaum', 'Bodoni 72', Didot, serif", SERIF = "'EB Garamond', Garamond, Georgia, serif";
      const C = { choco: '#6B3F35', paper: '#EEE4D8', hi: '#F6F0E8', ink: '#2A1E19', soft: '#6E5A50', rule: 'rgba(42,30,25,0.18)', coral: '#E06C55', ochre: '#E9B44C', ochreDeep: '#B9852B', blue: '#5D8CB5' };
      const measure = document.createElement('canvas').getContext('2d');
      const ops = [];
      let y = PAD - 10;
      const text = (str, font, color, o = {}) => {
        measure.font = font;
        wrapLines(measure, str, o.maxW || IW).forEach(l => { y += o.lh; ops.push({ t: 'text', s: l, font, color, x: o.center ? W / 2 : (o.x || PAD), y, align: o.center ? 'center' : 'left' }); });
      };
      const rule = (strong) => ops.push({ t: 'line', y, strong });

      // caption row
      y += 30;
      ops.push({ t: 'text', s: `${T.plateNo} I`, font: `italic 400 26px ${SERIF}`, color: C.ink, x: PAD, y, align: 'left' });
      ops.push({ t: 'text', s: dateStr, font: `italic 400 26px ${SERIF}`, color: C.ink, x: W / 2, y, align: 'center' });
      ops.push({ t: 'text', s: r.dayName, font: `italic 400 26px ${SERIF}`, color: C.ink, x: W - PAD, y, align: 'right' });
      y += 36;

      if (img) {
        const cw = 280, ch = 373;
        ops.push({ t: 'img', img, x: W / 2 - cw / 2, y, w: cw, h: ch });
        y += ch;
        text(fill(T.archangel, { a: r.archName }), `italic 400 26px ${SERIF}`, C.soft, { lh: 44, center: true });
      }
      y += 16;
      text(r.title.toUpperCase(), `400 92px ${GOTH}`, C.choco, { lh: 92, center: true, maxW: IW - 40 });
      y += 4;
      text(r.meta, `italic 400 30px ${SERIF}`, C.soft, { lh: 42, center: true });
      y += 30;

      // legend
      rule(true);
      const colW = IW / 2;
      for (let i = 0; i < r.items.length; i += 2) {
        const pair = r.items.slice(i, i + 2), rowTop = y;
        let maxY = y;
        pair.forEach(([k, label, v], j) => {
          const full = pair.length === 1;
          const x = PAD + (j ? colW + 18 : 0), w = full ? IW : colW - 26;
          let cy = rowTop + 34;
          ops.push({ t: 'text', s: NUM[k] + '.', font: `italic 400 24px ${SERIF}`, color: C.soft, x, y: cy, align: 'left' });
          ops.push({ t: 'text', s: label, font: `italic 400 22px ${SERIF}`, color: C.soft, x: x + 42, y: cy, align: 'left' });
          measure.font = `500 28px ${SERIF}`;
          wrapLines(measure, v, w).forEach(l => { cy += 34; ops.push({ t: 'text', s: l, font: `500 28px ${SERIF}`, color: C.ink, x, y: cy, align: 'left' }); });
          maxY = Math.max(maxY, cy + 16);
        });
        if (pair.length === 2) ops.push({ t: 'vline', x: PAD + colW, y1: rowTop, y2: maxY });
        y = maxY;
        rule(false);
      }
      y += 26;

      text(T.stepsTitle.toUpperCase(), `400 50px ${GOTH}`, C.choco, { lh: 54 });
      y += 10;
      r.steps.forEach((s, i) => {
        const startY = y;
        text(s, `400 28px ${SERIF}`, C.ink, { lh: 38, x: PAD + 56, maxW: IW - 56 });
        ops.push({ t: 'text', s: ROMAN[i] + '.', font: `italic 400 28px ${SERIF}`, color: C.coral, x: PAD, y: startY + 38, align: 'left' });
        y += 14;
      });
      y += 14;

      text(T.promptTitle.toUpperCase(), `400 50px ${GOTH}`, C.choco, { lh: 54 });
      y += 12;
      const pTop = y;
      text(r.prompt, `italic 400 34px ${SERIF}`, C.ink, { lh: 44, x: PAD + 26, maxW: IW - 26 });
      ops.push({ t: 'bar', x: PAD, y1: pTop + 8, y2: y + 12 });
      y += 44;

      text(r.gratitude, `italic 400 32px ${SERIF}`, C.ink, { lh: 44, center: true, maxW: IW - 80 });
      y += 26;

      if (r.safety.length) {
        rule(false);
        y += 6;
        r.safety.forEach(s => text('† ' + s, `400 22px ${SERIF}`, C.soft, { lh: 32 }));
        y += 18;
      }
      text('WHIMSY & RITUALS · MUNAAY CÓSMICO', `500 20px ${SERIF}`, C.ochreDeep, { lh: 36, center: true });

      const H = Math.ceil(y + PAD);
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = C.rule; ctx.lineWidth = 2; ctx.strokeRect(40, 40, W - 80, H - 80);

      for (const o of ops) {
        if (o.t === 'line') { ctx.strokeStyle = o.strong ? 'rgba(42,30,25,.45)' : C.rule; ctx.lineWidth = o.strong ? 2 : 1.5; ctx.beginPath(); ctx.moveTo(PAD, o.y); ctx.lineTo(W - PAD, o.y); ctx.stroke(); }
        else if (o.t === 'vline') { ctx.strokeStyle = C.rule; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(o.x, o.y1); ctx.lineTo(o.x, o.y2); ctx.stroke(); }
        else if (o.t === 'bar') { ctx.fillStyle = C.ochre; ctx.fillRect(o.x, o.y1, 4, o.y2 - o.y1); }
        else if (o.t === 'img') {
          ctx.fillStyle = C.hi; ctx.fillRect(o.x - 12, o.y - 12, o.w + 24, o.h + 24);
          ctx.strokeStyle = 'rgba(42,30,25,.45)'; ctx.lineWidth = 1.5; ctx.strokeRect(o.x - 12, o.y - 12, o.w + 24, o.h + 24);
          const s2 = Math.max(o.w / o.img.naturalWidth, o.h / o.img.naturalHeight);
          const dw = o.img.naturalWidth * s2, dh = o.img.naturalHeight * s2;
          ctx.save(); ctx.beginPath(); ctx.rect(o.x, o.y, o.w, o.h); ctx.clip();
          ctx.drawImage(o.img, o.x + (o.w - dw) / 2, o.y + (o.h - dh) / 2, dw, dh); ctx.restore();
        }
        else { ctx.font = o.font; ctx.fillStyle = o.color; ctx.textAlign = o.align; ctx.textBaseline = 'alphabetic'; ctx.fillText(o.s, o.x, o.y); }
      }
      return canvas;
    }

    function canvasBlob(canvas) {
      return new Promise((res, rej) => { try { canvas.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'); } catch (e) { rej(e); } });
    }

    async function downloadImage() {
      if (!state.current) return;
      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const r = buildRitual(state.current, state.lang), T = UI[state.lang];
        const dateStr = new Intl.DateTimeFormat(state.lang, { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(state.current.created));
        const img = await loadImage(archImg(r.arch));
        let blob;
        try { blob = await canvasBlob(paintCard(r, T, img, dateStr)); }
        catch (e) { blob = await canvasBlob(paintCard(r, T, null, dateStr)); } // e.g. opened from file://, where images taint the canvas
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ritual-${r.title.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      } catch (e) {
        toast(t('downloadError'));
      }
    }

    /* ---------------- Navigation ---------------- */
    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
      window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    }

    function openTab(cat, scroll) {
      state.tab = cat;
      renderParts(); renderTabs(); renderCatalog();
      if (scroll && window.innerWidth < 980) {
        const top = $('#tabs').getBoundingClientRect().top + window.scrollY - 58;
        window.scrollTo({ top, behavior: reduceMotion ? 'auto' : 'smooth' });
      }
    }

    /* ---------------- Events ---------------- */
    $('#parts').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) openTab(b.dataset.tab, true); });
    $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) openTab(b.dataset.tab, false); });
    $('#catalog').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) choose(b.dataset.cat, b.dataset.val); });

    $('#btn-go').addEventListener('click', () => startMachine(false));
    $('#btn-random').addEventListener('click', () => startMachine(true));
    $('#btn-reset').addEventListener('click', () => { state.pins = defaultPins(); state.table = []; savePrefs(); renderIntro(); });
    $('#btn-adjust').addEventListener('click', () => { show('screen-intro'); });

    $('#rows').addEventListener('click', e => {
      const b = e.target.closest('[data-lock]');
      if (!b || state.spinning) return;
      const r = b.dataset.lock;
      state.locks[r] = !state.locks[r];
      updateLock(r);
    });
    $('#btn-spin').addEventListener('click', () => spin(false));
    $('#btn-spin-all').addEventListener('click', () => spin(true));
    $('#btn-create').addEventListener('click', () => {
      const notes = applyConstraints();
      if (notes.length) { renderRows(); toast(t(notes[0])); }
      state.current = currentSelection();
      renderCard(state.current);
      show('screen-card');
    });

    $('#btn-save').addEventListener('click', saveCurrent);
    $('#btn-download').addEventListener('click', downloadImage);
    $('#btn-again').addEventListener('click', () => {
      state.current = null;
      if (ROWS.some(r => state.values[r] == null)) startMachine(false); else { show('screen-slots'); renderRows(); }
    });
    $('#btn-home').addEventListener('click', () => { state.current = null; show('screen-intro'); });

    $('#saved-list').addEventListener('click', e => {
      const v = e.target.closest('[data-view]'), d = e.target.closest('[data-del]');
      if (v) {
        const s = getSaved().find(x => x.id === v.dataset.view);
        if (s) { state.current = s; renderCard(s); show('screen-card'); }
      } else if (d) {
        if (!store.set(SAVED_KEY, getSaved().filter(x => x.id !== d.dataset.del))) toast(t('saveError'));
        renderSaved();
      }
    });

    /* ---------------- Init ---------------- */
    renderStatic();
  })();
  </script>
</body>
