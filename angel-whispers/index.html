<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angel Whispers Masterclass - Descubre tu Arcángel</title>
  <meta name="description" content="Descubre tu Arcángel Guardián basado en numerología angelical. Angel Whispers Masterclass de MUNAAY Cósmico.">
  <meta name="theme-color" content="#fbf8f1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Burgues+Script&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
    :root {
      --title: #a3c2e5;
      --text: #729eab;
      --cream: #fbf8f1;
      --card: #fffdf9;
      --font-title: 'Burgues Script', 'Great Vibes', cursive;
      --font-body: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: var(--font-body); 
      color: var(--text);
      background: var(--cream); 
      min-height: 100vh; 
      min-height: 100dvh; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }
    h1, h2 { font-family: var(--font-title); color: var(--title); font-weight: 400; }
    p, label, span { font-family: var(--font-body); color: var(--text); }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo {
      display: block;
      width: 100px;
      height: auto;
      margin: 0 auto 15px;
      filter: drop-shadow(0 2px 4px rgba(114, 158, 171, 0.35));
    }
    .logo-aw {
      display: block;
      width: 240px;
      max-width: 70vw;
      height: auto;
      margin: 0 auto 10px;
      filter: drop-shadow(0 2px 4px rgba(114, 158, 171, 0.3));
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .header h1 {
      font-size: 34px;
      margin-bottom: 5px;
    }
    .header p {
      font-size: 13px;
      font-weight: 500;
      margin: 0;
    }
    .container { 
      width: 100%; 
      max-width: 500px; 
    }
    .form-section, .ritual-section, .result-section { 
      background: var(--card); 
      border: 1px solid rgba(163, 194, 229, 0.3);
      border-radius: 20px; 
      padding: 40px; 
      box-shadow: 0 2px 6px rgba(114, 158, 171, 0.08), 0 16px 40px rgba(114, 158, 171, 0.16); 
      transition: all 0.4s ease; 
    }
    .hidden { display: none; }
    .form-section h2, .ritual-section h2, .result-section h2 { 
      text-align: center; 
      font-size: 30px; 
      margin-bottom: 25px; 
    }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; margin-bottom: 8px; font-weight: 500; }
    input { 
      width: 100%; 
      padding: 12px; 
      border: 2px solid #e8e2d5; 
      border-radius: 10px; 
      background: #fff;
      color: #3f6e7a;
      font-family: var(--font-body);
      font-size: 16px; 
      transition: all 0.3s ease; 
    }
    input::placeholder { color: var(--text); opacity: 0.75; }
    input[aria-invalid="true"] { border-color: #e74c3c; }
    input:focus { 
      outline: none; 
      border-color: var(--title); 
      box-shadow: 0 0 10px rgba(163, 194, 229, 0.35); 
    }
    button { 
      width: 100%; 
      padding: 14px 32px; 
      background: #5B8DB8; 
      color: #fff; 
      border: none; 
      border-radius: 8px; 
      font-family: var(--font-body);
      font-size: 16px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: all 0.3s ease; 
      margin-top: 10px; 
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button .ph { font-size: 18px; }
    @media (hover: hover) {
      button:hover {
        transform: translateY(-1px);
        box-shadow: inset 0 0 0 999px rgba(255, 255, 255, 0.15), 0 6px 16px rgba(44, 62, 80, 0.18);
      }
    }
    button:active { transform: translateY(0) scale(0.98); }
    button:focus-visible { outline: 3px solid var(--title); outline-offset: 2px; }
    .ritual-text { 
      text-align: center; 
      font-size: 18px; 
      font-weight: 500;
      color: var(--text); 
      line-height: 1.6; 
      margin-bottom: 30px; 
    }
    .breathing-circle { 
      width: 120px; 
      height: 120px; 
      margin: 40px auto; 
      background: linear-gradient(135deg, #a3c2e5 0%, #729eab 100%); 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 14px; 
      font-weight: 500;
      color: #fff; 
      animation: breathe 8s infinite; 
      box-shadow: 0 0 40px rgba(163, 194, 229, 0.6); 
    }
    @keyframes breathe { 
      0%, 100% { transform: scale(1); opacity: 0.6; } 
      50% { transform: scale(1.2); opacity: 1; } 
    }
    .result-section { 
      animation: slideInUp 0.6s ease, glow 3s ease-in-out infinite; 
    }
    @keyframes slideInUp { 
      from { opacity: 0; transform: translateY(30px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    @keyframes glow { 
      0%, 100% { box-shadow: 0 16px 40px rgba(114, 158, 171, 0.16), 0 0 30px rgba(163, 194, 229, 0.3); } 
      50% { box-shadow: 0 16px 40px rgba(114, 158, 171, 0.16), 0 0 50px rgba(163, 194, 229, 0.55); } 
    }
    .tarot-card {
      --bg-accent: #E8F4F8;
      --ink: #2C3E50;
      --accent: #6B8E99;
      --secondary: #A8D5E2;
      --box-bg: rgba(232, 244, 248, 0.95);
      --box-line: rgba(168, 213, 226, 0.7);
      position: relative;
      width: 420px;
      max-width: 100%;
      aspect-ratio: 3 / 4;
      margin: 0 auto 24px;
      border-radius: 15px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 1px 2px rgba(44, 62, 80, 0.08), 0 12px 32px rgba(44, 62, 80, 0.14);
    }
    /* Palette 1: Healing / Water */
    .tarot-card[data-palette="1"] { --bg-accent: #E8F4F8; --ink: #2C3E50; --accent: #6B8E99; --secondary: #A8D5E2; --box-bg: rgba(232, 244, 248, 0.95); --box-line: rgba(168, 213, 226, 0.7); }
    /* Palette 2: Protection / Fire */
    .tarot-card[data-palette="2"] { --bg-accent: #FEF3E6; --ink: #3D3D3D; --accent: #C9956F; --secondary: #E5C9A8; --box-bg: rgba(254, 243, 230, 0.95); --box-line: rgba(229, 201, 168, 0.7); }
    /* Palette 3: Wisdom / Earth */
    .tarot-card[data-palette="3"] { --bg-accent: #F0F5E8; --ink: #2D3D2D; --accent: #7A9FB5; --secondary: #B8C9A8; --box-bg: rgba(240, 245, 232, 0.95); --box-line: rgba(184, 201, 168, 0.7); }
    .tarot-image {
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 6px;
      background-size: cover;
      background-position: center;
    }
    .tarot-message {
      position: absolute;
      left: 50%;
      bottom: 15%;
      width: 82%;
      transform: translateX(-50%);
      padding: 20px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
      text-align: center;
      color: #393a35;
    }
    .tarot-message.is-light { color: #f6ead8; }
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 420px;
      max-width: 100%;
      margin: 0 auto;
    }
    .action-buttons button {
      margin-top: 0;
      padding: 14px 32px;
      font-size: 15px;
    }
    .action-buttons .download-btn { grid-column: 1 / -1; }
    .download-btn { background: #5B8DB8; color: #fff; }
    .share-btn { background: #729eab; color: #fff; }
    .another-btn { background: #a3c2e5; color: #2C3E50; }
    .error { color: #e74c3c; font-size: 13px; margin-top: 5px; }
    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
    }
    .footer p {
      margin: 5px 0;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .breathing-circle { opacity: 1; }
    }
    @media (max-width: 600px) {
      .form-section, .ritual-section, .result-section {
        padding: 25px;
      }
      .form-section h2, .ritual-section h2, .result-section h2 {
        font-size: 26px;
      }
      body { padding: 20px 5vw; }
      .result-section {
        padding: 20px 0;
        background: transparent;
        border: none;
        box-shadow: none;
        animation: slideInUp 0.6s ease;
      }
      .tarot-image { inset: 10px; }
      .tarot-message { font-size: 12px; line-height: 1.5; padding: 12px 14px; width: 88%; bottom: 14%; }
      .action-buttons button { padding: 14px 16px; }
    }
  </style>
</head>

    document.getElementById('angelForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const birthday = document.getElementById('birthday').value;
      setError('name', '');
      setError('birthday', '');
      
      if (!name) {
        setError('name', 'Por favor ingresa tu nombre');
        return;
      }
      if (!birthday) {
        setError('birthday', 'Por favor selecciona tu fecha de nacimiento');
        return;
      }
      
      const day = parseInt(birthday.split('-')[2]);
      let essence = day;
      
      if (essence !== 11 && essence !== 22) {
        while (essence > 9) {
          essence = Math.floor(essence / 10) + (essence % 10);
        }
      }
      
      showRitual();
      setTimeout(() => showResult(name, essence), 4000);
    });

    function setError(field, message) {
      document.getElementById(field + 'Error').textContent = message;
      document.getElementById(field).setAttribute('aria-invalid', message ? 'true' : 'false');
    }

    function showRitual() {
      document.getElementById('formSection').classList.add('hidden');
      document.getElementById('ritualSection').classList.remove('hidden');
    }

    // Cards whose artwork is dark red need light text (Uriel, Nathaniel)
    const lightTextCards = [4, 10];
    let currentAngel = null;

    function showResult(name, essence) {
      const angel = angels[essence];
      document.getElementById('ritualSection').classList.add('hidden');
      document.getElementById('resultSection').classList.remove('hidden');
      
      currentAngel = angel;
      const message = document.getElementById('tarotMessage');
      message.textContent = `Para ${name}: ${messages[essence]}`;
      message.classList.toggle('is-light', lightTextCards.includes(angel.card));
      document.getElementById('tarotImage').style.backgroundImage = `url('${angel.image}')`;
      document.getElementById('tarotCard').dataset.palette = angel.palette;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function roundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // html2canvas downsamples background images to their CSS size, which blurs the artwork.
    // So it only renders the frame and message; the artwork is drawn here at full resolution.
    function downloadCard() {
      const card = document.getElementById('tarotCard');
      const scale = 3;
      const cardWidth = 420;
      let imageBox;
      const exportOptions = {
        backgroundColor: null,
        scale,
        useCORS: true,
        onclone: doc => {
          const clone = doc.getElementById('tarotCard');
          clone.style.width = cardWidth + 'px';
          clone.style.maxWidth = 'none';
          clone.style.background = 'transparent';
          const image = doc.getElementById('tarotImage');
          imageBox = { x: image.offsetLeft, y: image.offsetTop, w: image.offsetWidth, h: image.offsetHeight };
          image.style.backgroundImage = 'none';
        }
      };

      Promise.all([
        document.fonts.ready.then(() => html2canvas(card, exportOptions)),
        loadImage(currentAngel.image)
      ]).then(([overlay, art]) => {
        const out = document.createElement('canvas');
        out.width = overlay.width;
        out.height = overlay.height;
        const ctx = out.getContext('2d');
        ctx.imageSmoothingQuality = 'high';

        // JPG has no transparency: white page behind the rounded corners, then the card's frosted fill
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, out.width, out.height);
        roundedRect(ctx, 0, 0, out.width, out.height, 15 * scale);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fill();

        // Artwork with background-size: cover, clipped to the image's rounded corners
        const box = { x: imageBox.x * scale, y: imageBox.y * scale, w: imageBox.w * scale, h: imageBox.h * scale };
        const coverScale = Math.max(box.w / art.width, box.h / art.height);
        const sw = box.w / coverScale;
        const sh = box.h / coverScale;
        ctx.save();
        roundedRect(ctx, box.x, box.y, box.w, box.h, 6 * scale);
        ctx.clip();
        ctx.drawImage(art, (art.width - sw) / 2, (art.height - sh) / 2, sw, sh, box.x, box.y, box.w, box.h);
        ctx.restore();

        ctx.drawImage(overlay, 0, 0);

        const link = document.createElement('a');
        link.href = out.toDataURL('image/jpeg', 0.92);
        link.download = `mi-arcangel-${new Date().getTime()}.jpg`;
        link.click();
      });
    }

          twitter: `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`,
          facebook: `https://www.facebook.com/sharer/sharer.php?quote=${encodeURIComponent(text)}`,
          whatsapp: `https://wa.me/?text=${encodeURIComponent(text)}`
        };
        alert('Comparte tu descubrimiento:\n\n' + text);
        window.open(urls.twitter, '_blank');
      }
    }

    function resetForm() {
      document.getElementById('angelForm').reset();
      setError('name', '');
      setError('birthday', '');
      document.getElementById('resultSection').classList.add('hidden');
      document.getElementById('formSection').classList.remove('hidden');
    }
  </script>
</body>
